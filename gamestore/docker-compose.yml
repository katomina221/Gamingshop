services:

  postgres:
    image: postgres:16
    container_name: gamestore-postgres
    environment:
      POSTGRES_DB: gamestore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gamestore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
