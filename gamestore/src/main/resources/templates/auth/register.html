<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — GameStore</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',sans-serif; background:#1a1a2e; color:#e0e0e0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .auth-box { background:#16213e; padding:2.5rem; border-radius:12px; width:100%; max-width:420px; border:1px solid #0f3460; }
        .auth-logo { text-align:center; font-size:1.8rem; font-weight:700; color:#e94560; margin-bottom:0.5rem; }
        .auth-subtitle { text-align:center; color:#888; margin-bottom:2rem; font-size:0.9rem; }
        .form-group { margin-bottom:1.2rem; }
        .form-group label { display:block; margin-bottom:0.4rem; color:#aaa; font-size:0.9rem; }
        .form-group input { width:100%; padding:0.7rem 1rem; background:#0f3460; border:1px solid #1a4a7a; border-radius:6px; color:#e0e0e0; font-size:0.95rem; }
        .form-group input:focus { outline:none; border-color:#e94560; }
        .btn-submit { width:100%; padding:0.8rem; background:#e94560; color:white; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
        .btn-submit:hover { background:#c73652; }
        .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#888; }
        .auth-footer a { color:#e94560; text-decoration:none; }
        .alert { padding:0.75rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem; background:rgba(233,69,96,0.2); border-left:3px solid #e94560; }
    </style>
</head>
<body>
<div class="auth-box">
    <div class="auth-logo">🎮 GameStore</div>
    <div class="auth-subtitle">Создать аккаунт</div>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" name="username" placeholder="Придумайте логин" required minlength="3">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
        </div>
        <div class="form-group">
            <label>Подтвердите пароль</label>
            <input type="password" name="confirmPassword" placeholder="Повторите пароль" required>
        </div>
        <button type="submit" class="btn-submit">Создать аккаунт</button>
    </form>

    <div class="auth-footer">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>
</body>
</html>
