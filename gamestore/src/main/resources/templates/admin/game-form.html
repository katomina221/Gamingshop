<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая игра — GameStore</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
    <style>
        .form-card {
            background: #16213e;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 700px;
            margin: 1rem auto;
        }
        .form-card h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .form-row { margin-bottom: 1.2rem; }
        .form-row label {
            display: block; margin-bottom: 0.4rem;
            color: #aaa; font-size: 0.9rem;
        }
        .form-row input, .form-row textarea, .form-row select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #0f3460;
            border: 1px solid #1a4a7a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
            outline: none; border-color: #e94560;
        }
        .form-row textarea { min-height: 100px; resize: vertical; }
        .form-row .hint { font-size: 0.8rem; color: #666; margin-top: 0.3rem; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 540px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .form-actions .btn { flex: 1; padding: 0.8rem; }
        .breadcrumb { color: #666; margin-bottom: 1rem; font-size: 0.9rem; }
        .breadcrumb a { color: #888; }
        .breadcrumb a:hover { color: #e94560; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="breadcrumb">
        <a href="/admin">← Админ-панель</a> / Новая игра
    </div>

    <div class="form-card">
        <h1>➕ Добавить игру</h1>

        <form th:action="@{/admin/games/save}" method="post">
            <div class="form-row">
                <label>Название игры *</label>
                <input type="text" name="title" required maxlength="120"
                       placeholder="Например: The Witcher 3">
            </div>

            <div class="form-row">
                <label>Описание *</label>
                <textarea name="description" required
                          placeholder="Краткое описание игры, жанровые особенности..."></textarea>
            </div>

            <div class="form-grid">
                <div class="form-row">
                    <label>Цена ($) *</label>
                    <input type="number" name="price" step="0.01" min="0" required
                           placeholder="0.00">
                    <div class="hint">Поставьте 0 для бесплатной игры</div>
                </div>

                <div class="form-row">
                    <label>Жанр *</label>
                    <input type="text" name="genre" required list="genres"
                           placeholder="RPG, Шутер, Экшен...">
                    <datalist id="genres">
                        <option value="RPG"></option>
                        <option value="Шутер"></option>
                        <option value="Экшен"></option>
                        <option value="Стратегия"></option>
                        <option value="Симулятор"></option>
                        <option value="Инди"></option>
                        <option value="Приключение"></option>
                        <option value="MOBA"></option>
                        <option value="Action RPG"></option>
                    </datalist>
                </div>
            </div>

            <div class="form-row">
                <label>Разработчик *</label>
                <input type="text" name="developer" required
                       placeholder="CD Projekt Red">
            </div>

            <div class="form-row">
                <label>Ссылка на обложку</label>
                <input type="url" name="imageUrl"
                       placeholder="https://...">
                <div class="hint">Если пусто — будет заглушка</div>
            </div>

            <div class="form-actions">
                <a href="/admin" class="btn btn-outline" style="text-align:center; line-height:1.5">
                    Отмена
                </a>
                <button type="submit" class="btn btn-primary">
                    💾 Сохранить
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
