<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Корзина — GameStore</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
    <style>
        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }
        @media (max-width: 768px) {
            .cart-layout { grid-template-columns: 1fr; }
        }
        .page-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem; }

        .cart-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto;
            gap: 1rem;
            align-items: center;
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .cart-item img {
            width: 80px; height: 100px;
            object-fit: cover;
            border-radius: 4px;
            background: #0f3460;
        }
        .cart-item-title { font-weight: 600; margin-bottom: 0.25rem; }
        .cart-item-genre { color: #888; font-size: 0.85rem; }
        .cart-item-price { color: #4fc3f7; font-weight: 700; font-size: 1.1rem; }
        .cart-item-price.free { color: #4caf50; }

        .summary {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .summary h3 { margin-bottom: 1rem; }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            color: #aaa;
        }
        .summary-row.total {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            border-top: 1px solid #0f3460;
            padding-top: 1rem;
            margin-top: 0.5rem;
        }
        .summary .btn { width: 100%; margin-top: 1rem; padding: 0.8rem; font-size: 1rem; }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            background: #16213e;
            border-radius: 8px;
        }
        .empty-cart .emoji { font-size: 4rem; margin-bottom: 1rem; }
        .empty-cart h2 { margin-bottom: 0.5rem; }
        .empty-cart p { color: #888; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <h1 class="page-title">🛒 Корзина</h1>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <div class="empty-cart" th:if="${#lists.isEmpty(cart)}">
        <div class="emoji">🛒</div>
        <h2>Корзина пуста</h2>
        <p>Добавьте игры из каталога, и они появятся здесь</p>
        <a href="/games" class="btn btn-primary">Перейти в каталог</a>
    </div>

    <div class="cart-layout" th:unless="${#lists.isEmpty(cart)}">
        <div>
            <div class="cart-item" th:each="game : ${cart}">
                <img th:src="${game.imageUrl}" th:alt="${game.title}"
                     onerror="this.src='https://placehold.co/80x100/16213e/e94560?text=G'">
                <div>
                    <div class="cart-item-title">
                        <a th:href="@{/games/{id}(id=${game.id})}" th:text="${game.title}">Игра</a>
                    </div>
                    <div class="cart-item-genre" th:text="${game.genre}">Жанр</div>
                </div>
                <div class="cart-item-price"
                     th:classappend="${game.price.doubleValue() == 0} ? 'free' : ''"
                     th:text="${game.price.doubleValue() == 0 ? 'Бесплатно' : '$' + game.price}">
                    $0
                </div>
                <form th:action="@{'/cart/remove/' + ${game.id}}" method="post">
                    <button type="submit" class="btn btn-danger" title="Убрать из корзины">🗑</button>
                </form>
            </div>
        </div>

        <aside class="summary">
            <h3>Итого</h3>
            <div class="summary-row">
                <span>Игр в корзине:</span>
                <span th:text="${#lists.size(cart)}">0</span>
            </div>
            <div class="summary-row total">
                <span>К оплате:</span>
                <span th:text="'$' + ${total}">$0.00</span>
            </div>

            <form th:action="@{/cart/checkout}" method="post">
                <button type="submit" class="btn btn-success">
                    💳 Оформить покупку
                </button>
            </form>

            <a href="/games" class="btn btn-outline" style="width:100%; margin-top:0.5rem; text-align:center">
                ← Продолжить покупки
            </a>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
