<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Профиль — GameStore</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
    <style>
        .profile-card {
            background: #16213e;
            border-radius: 12px;
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #0f3460;
        }
        .avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 700;
        }
        .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .profile-email { color: #888; font-size: 0.9rem; }
        .role-badge {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.2rem 0.6rem;
            background: rgba(233,69,96,0.2);
            color: #e94560;
            border-radius: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .role-badge.admin { background: rgba(255,193,7,0.2); color: #ffc107; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 1.2rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #4fc3f7; }
        .stat-label { color: #888; font-size: 0.85rem; margin-top: 0.25rem; }

        .quick-links { display: flex; gap: 1rem; flex-wrap: wrap; }
        .quick-links .btn { flex: 1; min-width: 150px; text-align: center; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}">A</div>
            <div>
                <div class="profile-name" th:text="${user.username}">username</div>
                <div class="profile-email" th:text="${user.email}">email</div>
                <span class="role-badge"
                      th:classappend="${user.role == 'ROLE_ADMIN'} ? 'admin' : ''"
                      th:text="${user.role == 'ROLE_ADMIN' ? '⚙ Администратор' : 'Игрок'}">Игрок</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" th:text="${#lists.size(user.library)}">0</div>
                <div class="stat-label">Игр в библиотеке</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${#lists.size(user.cart)}">0</div>
                <div class="stat-label">В корзине</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="'$' + ${user.balance}">$0</div>
                <div class="stat-label">Баланс</div>
            </div>
        </div>

        <div class="quick-links">
            <a href="/library" class="btn btn-primary">📚 Моя библиотека</a>
            <a href="/cart" class="btn btn-outline">🛒 Корзина</a>
            <a href="/games" class="btn btn-outline">Магазин</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
